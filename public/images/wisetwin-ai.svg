<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12244d"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0066CC"/>
      <stop offset="1" stop-color="#4f8ef7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- réseau de noeuds (tools de l'agent) -->
  <g stroke="#2e4a7d" stroke-width="1.5" opacity="0.8">
    <line x1="560" y1="120" x2="650" y2="80"/>
    <line x1="560" y1="120" x2="680" y2="150"/>
    <line x1="560" y1="120" x2="620" y2="210"/>
    <line x1="620" y1="210" x2="700" y2="250"/>
    <line x1="620" y1="210" x2="580" y2="290"/>
    <line x1="580" y1="290" x2="660" y2="340"/>
  </g>
  <g fill="#4f8ef7">
    <circle cx="560" cy="120" r="10"/>
    <circle cx="650" cy="80" r="6"/>
    <circle cx="680" cy="150" r="6"/>
    <circle cx="620" cy="210" r="8"/>
    <circle cx="700" cy="250" r="6"/>
    <circle cx="580" cy="290" r="7"/>
    <circle cx="660" cy="340" r="5"/>
  </g>
  <!-- bulles de conversation -->
  <g>
    <rect x="80" y="100" width="300" height="52" rx="14" fill="#1c2c4d"/>
    <circle cx="110" cy="126" r="9" fill="#3b5998" opacity="0.9"/>
    <rect x="132" y="116" width="190" height="8" rx="4" fill="#5f7bb0"/>
    <rect x="132" y="132" width="130" height="8" rx="4" fill="#40598c"/>
  </g>
  <g>
    <rect x="140" y="180" width="330" height="70" rx="14" fill="url(#bubble)"/>
    <rect x="165" y="198" width="240" height="8" rx="4" fill="#dce9ff"/>
    <rect x="165" y="214" width="270" height="8" rx="4" fill="#b8d2fa"/>
    <rect x="165" y="230" width="180" height="8" rx="4" fill="#dce9ff"/>
  </g>
  <!-- chip "tool call" -->
  <g>
    <rect x="140" y="268" width="170" height="30" rx="15" fill="none" stroke="#4f8ef7" stroke-width="1.5"/>
    <circle cx="160" cy="283" r="5" fill="#7fe0a7"/>
    <rect x="175" y="279" width="115" height="8" rx="4" fill="#7ba4e0"/>
  </g>
  <text x="80" y="392" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8f0ff">Copilote IA HSE</text>
  <text x="80" y="420" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8aa8d8">Agent LLM &#183; RAG &#183; 62 726 incidents ARIA</text>
</svg>
