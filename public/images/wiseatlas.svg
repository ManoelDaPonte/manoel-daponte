<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a14"/>
      <stop offset="1" stop-color="#123a4d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- grille de carte en perspective -->
  <g stroke="#2a5a66" stroke-width="1" opacity="0.7">
    <path d="M 60 340 L 740 340" />
    <path d="M 110 290 L 690 290" />
    <path d="M 150 250 L 650 250" />
    <path d="M 182 218 L 618 218" />
    <path d="M 120 380 L 320 180" />
    <path d="M 280 380 L 400 180" />
    <path d="M 440 380 L 480 180" />
    <path d="M 600 380 L 560 180" />
  </g>
  <!-- zone (polygone) -->
  <path d="M 180 320 L 300 260 L 420 285 L 380 345 L 220 350 Z" fill="#1f8a70" opacity="0.35" stroke="#35c9a3" stroke-width="2"/>
  <!-- réseau (polyligne) -->
  <path d="M 140 360 C 280 300, 420 330, 520 250 S 660 210, 700 195" fill="none" stroke="#4f8ef7" stroke-width="3" stroke-dasharray="1 0"/>
  <!-- pins -->
  <g>
    <g transform="translate(300,225)">
      <path d="M 0 0 C -14 -22 14 -22 0 0 Z" fill="#ff6b6b" transform="scale(1.6)"/>
      <circle cx="0" cy="-26" r="10" fill="#ff6b6b"/>
      <circle cx="0" cy="-26" r="4" fill="#ffffff"/>
    </g>
    <g transform="translate(520,250)">
      <path d="M 0 0 C -14 -22 14 -22 0 0 Z" fill="#ffc94d" transform="scale(1.4)"/>
      <circle cx="0" cy="-23" r="9" fill="#ffc94d"/>
      <circle cx="0" cy="-23" r="3.5" fill="#ffffff"/>
    </g>
    <g transform="translate(650,300)">
      <path d="M 0 0 C -14 -22 14 -22 0 0 Z" fill="#35c9a3" transform="scale(1.5)"/>
      <circle cx="0" cy="-24" r="9" fill="#35c9a3"/>
      <circle cx="0" cy="-24" r="3.5" fill="#ffffff"/>
    </g>
  </g>
  <!-- bâtiment 3D -->
  <g>
    <path d="M 585 205 L 585 160 L 615 150 L 615 195 Z" fill="#3d6f8a"/>
    <path d="M 615 195 L 615 150 L 640 158 L 640 203 Z" fill="#2b5468"/>
    <path d="M 585 160 L 615 150 L 640 158 L 610 168 Z" fill="#5b93b3"/>
  </g>
  <text x="80" y="392" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8fff7">WiseAtlas</text>
  <text x="80" y="420" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#7fc4b0">Cartes 3D photor&#233;alistes &#183; storytelling de territoire</text>
</svg>
